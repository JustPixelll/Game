name: Build Bramblehaven
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bramblehaven-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine and ordinary-play progression tests
        shell: bash
        run: |
          mkdir -p dist
          node --test tests/engine.test.cjs | tee dist/engine-tests.txt
          node scripts/opening-check.cjs | tee dist/opening-test.txt
          python3 scripts/make-icons.py
          python3 scripts/bundle.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned Android package
        shell: bash
        run: bash scripts/build-android.sh 2>&1 | tee dist/android-build.txt
      - name: Upload Android package and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: Bramblehaven-android-unsigned
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
      - name: Install browser test tools
        shell: bash
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser interaction tests
        shell: bash
        run: python3 tests/ui_smoke.py | tee dist/ui-tests.txt
      - name: Upload portable game and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bramblehaven-web-and-tests
          path: |
            dist/*.html
            dist/*.png
            dist/*.txt
          if-no-files-found: warn
          retention-days: 30
